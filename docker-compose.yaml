version: '3.8'

services:
  # DATABASE
  agenda-app-database:
    image: mysql:8.0
    container_name: mysql-agenda-app-container
    environment:
      MYSQL_ROOT_PASSWORD: MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: agenda-app-database
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # JAVA APP
  my-java-app:
    build: .
    container_name: java-agenda-app-container
    depends_on:
      - agenda-app-database

volumes:
  mysql-data:
