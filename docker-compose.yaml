
services:
  # DATABASE
  agenda-app-database:
    image: mysql:8.0
    container_name: mysql-agenda-app-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
        interval: 5s
        timeout: 5s
        retries: 10

  # JAVA APP
  my-java-app:
    build: .
    container_name: java-agenda-app-container
    environment:
      DB_HOST: agenda-app-database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      agenda-app-database:
        condition: service_healthy
    
volumes:
    mysql-data:
